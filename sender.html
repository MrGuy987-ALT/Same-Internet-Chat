<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto;">
    <h2>Two-Way Chat (Computer A)</h2>
    
    <div style="background: #eee; padding: 10px; border-radius: 8px; margin-bottom: 20px;">
        <button onclick="createOffer()">1. Create Offer</button><br>
        <textarea id="offerCode" placeholder="Offer code..." rows="2" style="width:100%"></textarea>
        <p>Paste Answer from B:</p>
        <textarea id="answerCode" placeholder="Paste answer here..." rows="2" style="width:100%"></textarea>
        <button onclick="acceptAnswer()">2. Connect</button>
    </div>

    <div id="chatArea" style="display:none;">
        <input type="text" id="username" placeholder="Your Name" value="User A" style="width: 80px;">
        <input type="text" id="msgInput" placeholder="Type a message..." style="width: 300px; padding: 5px;">
        <button onclick="sendMessage()">Send</button>
        
        <div id="history" style="border: 1px solid #ccc; margin-top: 15px; height: 300px; overflow-y: auto; padding: 10px; background: #fff;"></div>
    </div>

    <script>
        const pc = new RTCPeerConnection();
        let dc = pc.createDataChannel("chat");

        setupDC(dc);

        async function createOffer() {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            setTimeout(() => { document.getElementById('offerCode').value = JSON.stringify(pc.localDescription); }, 500);
        }

        async function acceptAnswer() {
            const ans = JSON.parse(document.getElementById('answerCode').value);
            await pc.setRemoteDescription(ans);
        }

        function setupDC(channel) {
            channel.onopen = () => document.getElementById('chatArea').style.display = "block";
            channel.onmessage = (e) => displayMessage(JSON.parse(e.data), 'received');
        }

        function sendMessage() {
            const msg = {
                user: document.getElementById('username').value,
                text: document.getElementById('msgInput').value,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };
            dc.send(JSON.stringify(msg));
            displayMessage(msg, 'sent');
            document.getElementById('msgInput').value = "";
        }

        function displayMessage(data, type) {
            const div = document.createElement('div');
            div.style.color = type === 'sent' ? 'blue' : 'green';
            div.innerHTML = `[${data.time}] <b>${data.user}:</b> ${data.text}`;
            document.getElementById('history').appendChild(div);
        }
    </script>
</body>
</html>
